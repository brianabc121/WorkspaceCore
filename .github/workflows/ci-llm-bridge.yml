name: ci-llm-bridge

# 大模型会话桥（docs/v2/LLM_BRIDGE_PLAN.md）：
# - llm-bridge：会话桥服务（services/llm-bridge）的 ruff、mypy、pytest，对锁定版本的官方命令行实测（不需要登录的部分）；
# - image：按部署指南“另一台服务器”的方式构建镜像并启动，冒烟检查；
# - workspace：和工作台同机部署（make up + make llm-bridge-up），浏览器验收设置页——真实后端 + 真实前端 + 真实会话桥容器。
# 本文件归 claude 维护。
on:
  pull_request:
    paths:
      - services/llm-bridge/**
      - infra/llm-bridge/**
      - services/api/app/modules/llm_bridge/**
      - apps/web/src/modules/llm_bridge/**
      - tests/e2e/llm_bridge_browser.cjs
      - Makefile
      - .github/workflows/ci-llm-bridge.yml
  push:
    branches: [main]
    paths:
      - services/llm-bridge/**
      - infra/llm-bridge/**
      - services/api/app/modules/llm_bridge/**
      - apps/web/src/modules/llm_bridge/**
      - tests/e2e/llm_bridge_browser.cjs
      - Makefile
      - .github/workflows/ci-llm-bridge.yml

permissions:
  contents: read

jobs:
  llm-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/llm-bridge
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: services/llm-bridge/uv.lock
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: 安装依赖（必须与 uv.lock 一致）
        run: uv sync --locked
      - name: ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: mypy
        run: uv run mypy bridge
      - name: pytest
        run: uv run pytest
      - name: 安装锁定版本的官方命令行（与 Dockerfile 一致）
        run: |
          mkdir -p "$RUNNER_TEMP/cli" && cd "$RUNNER_TEMP/cli"
          npm install --no-audit --no-fund \
            @openai/codex@0.169.0 @anthropic-ai/claude-code@2.1.323 @tencent-ai/codebuddy-code@2.184.0
      - name: 对真实的 codex / codebuddy 实测驱动（不需要登录的部分）
        run: BRIDGE_LIVE_CLI_DIR="$RUNNER_TEMP/cli/node_modules/.bin" uv run pytest tests/test_live.py -v

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: 构建镜像并启动（管理令牌每次运行随机生成）
        run: |
          echo "LLM_BRIDGE_ADMIN_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          export LLM_BRIDGE_ADMIN_TOKEN="$(tail -1 "$GITHUB_ENV" | cut -d= -f2)"
          docker compose -f infra/llm-bridge/compose.yaml up -d --build
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8787/healthz >/dev/null 2>&1 && break
            sleep 2
          done
      - name: 冒烟检查
        run: >
          infra/llm-bridge/smoke.sh myworkspace-llm-bridge-llm-bridge-1 http://127.0.0.1:8787
          "$LLM_BRIDGE_ADMIN_TOKEN"
      - name: 失败时输出容器日志
        if: failure()
        run: docker compose -f infra/llm-bridge/compose.yaml logs --no-color | tail -100

  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: 生成 .env（随机密码与密钥）
        run: make env
      - name: 构建并启动工作台（make up）
        run: make up
      - name: 数据库迁移（make migrate）
        run: make migrate
      - name: 启动会话桥（make llm-bridge-up：第一次生成管理令牌写进 .env，加入工作台的 integrations 网络）
        run: |
          make llm-bridge-up
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8787/healthz >/dev/null 2>&1 && break
            sleep 2
          done
          # 再运行一次不应重新生成令牌（否则已登记的会话桥会连不上）
          before="$(make -s llm-bridge-token)"
          make llm-bridge-up
          [ "$(make -s llm-bridge-token)" = "$before" ] && [ "${#before}" -ge 32 ]
          # 工作台的 api 容器能按内部网络里的名字访问会话桥
          docker compose exec -T api python -c "import urllib.request; print(urllib.request.urlopen('http://llm-bridge:8787/healthz', timeout=10).read().decode())"
      - name: 会话桥冒烟检查（同机部署的容器）
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8787/healthz >/dev/null 2>&1 && break
            sleep 2
          done
          infra/llm-bridge/smoke.sh my-workspace-llm-bridge-llm-bridge-1 http://127.0.0.1:8787 "$(make -s llm-bridge-token)"
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: 安装浏览器验收依赖（Playwright 版本由 tests/e2e 的锁文件固定）
        working-directory: tests/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: 大模型会话桥浏览器验收（应用中心启用、登记、三个账号槽位与通道、API 密钥登录与退出、Claude 风险确认、设置、开发环境、会话、实例权限、令牌不对的提示、admin 只读、member 不可见、手机宽度）
        # 不要求空库：每次新建工作台用户。登记的地址是内部网络里的 http://llm-bridge:8787
        run: LLM_BRIDGE_ADMIN_TOKEN="$(make -s llm-bridge-token)" node tests/e2e/llm_bridge_browser.cjs
      - name: 失败时输出服务状态与日志
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=150 api caddy web
          docker ps -a --filter name=llm-bridge
          docker logs --tail 150 my-workspace-llm-bridge-llm-bridge-1 2>&1 || true
      - name: 停止服务
        if: always()
        run: |
          make llm-bridge-down || true
          make down
