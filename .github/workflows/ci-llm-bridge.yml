name: ci-llm-bridge

# 大模型客户端的 MCP 管理器，也就是会话桥（docs/v2/LLM_BRIDGE_PLAN.md）：
# - llm-bridge：会话桥服务（services/llm-bridge）的 ruff、mypy、pytest，对锁定版本的官方命令行实测（不需要登录的部分）；
# - image：按部署指南“另一台服务器”的方式构建镜像并启动，冒烟检查；
# - workspace：和工作台同机部署两个 MCP 管理器（make up + make llm-bridge-up + make llm-bridge-up N=2），
#   浏览器验收“大模型客户端管理”页面——真实后端 + 真实前端 + 两个真实的会话桥容器。
# 本文件归 claude 维护。
on:
  pull_request:
    paths:
      - services/llm-bridge/**
      - infra/llm-bridge/**
      - services/api/app/modules/llm_bridge/**
      - apps/web/src/modules/llm_bridge/**
      - tests/e2e/llm_bridge_browser.cjs
      - Makefile
      - .github/workflows/ci-llm-bridge.yml
  push:
    branches: [main]
    paths:
      - services/llm-bridge/**
      - infra/llm-bridge/**
      - services/api/app/modules/llm_bridge/**
      - apps/web/src/modules/llm_bridge/**
      - tests/e2e/llm_bridge_browser.cjs
      - Makefile
      - .github/workflows/ci-llm-bridge.yml

permissions:
  contents: read

jobs:
  llm-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/llm-bridge
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: services/llm-bridge/uv.lock
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: 安装依赖（必须与 uv.lock 一致）
        run: uv sync --locked
      - name: ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: mypy
        run: uv run mypy bridge
      - name: pytest
        run: uv run pytest
      - name: 安装锁定版本的官方命令行（与 Dockerfile 一致）
        run: |
          mkdir -p "$RUNNER_TEMP/cli" && cd "$RUNNER_TEMP/cli"
          npm install --no-audit --no-fund \
            @openai/codex@0.169.0 @anthropic-ai/claude-code@2.1.323 @tencent-ai/codebuddy-code@2.184.0
      - name: 对真实的 codex / codebuddy 实测驱动（不需要登录的部分）
        run: BRIDGE_LIVE_CLI_DIR="$RUNNER_TEMP/cli/node_modules/.bin" uv run pytest tests/test_live.py -v

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: 构建镜像并启动（管理令牌每次运行随机生成）
        run: |
          echo "LLM_BRIDGE_ADMIN_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          export LLM_BRIDGE_ADMIN_TOKEN="$(tail -1 "$GITHUB_ENV" | cut -d= -f2)"
          docker compose -f infra/llm-bridge/compose.yaml up -d --build
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8787/healthz >/dev/null 2>&1 && break
            sleep 2
          done
      - name: 冒烟检查
        run: >
          infra/llm-bridge/smoke.sh myworkspace-llm-bridge-mcp-manager-1 http://127.0.0.1:8787
          "$LLM_BRIDGE_ADMIN_TOKEN"
      - name: 失败时输出容器日志
        if: failure()
        run: docker compose -f infra/llm-bridge/compose.yaml logs --no-color | tail -100

  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: 生成 .env（随机密码与密钥）
        run: make env
      - name: 构建并启动工作台（make up）
        run: make up
      - name: 数据库迁移（make migrate）
        run: make migrate
      - name: 启动 1 号 MCP 管理器（make llm-bridge-up：第一次生成管理令牌写进 .env，加入工作台的 integrations 网络）
        run: |
          # make llm-bridge-up 自己等到健康检查通过才返回
          make llm-bridge-up
          curl -fsS http://127.0.0.1:8787/healthz
          # 再运行一次不应重新生成令牌（否则已添加的管理器会连不上）。
          # 这一次可能重建容器（构建带来源证明时镜像摘要每次都变），所以后面的检查依赖它等到健康才返回
          before="$(make -s llm-bridge-token)"
          make llm-bridge-up
          [ "$(make -s llm-bridge-token)" = "$before" ] && [ "${#before}" -ge 32 ]
      - name: 启动 2 号 MCP 管理器（make llm-bridge-up N=2：自己的项目、数据卷、令牌、端口和内部网络里的名字）
        run: |
          before="$(make -s llm-bridge-token)"
          make llm-bridge-up N=2
          curl -fsS http://127.0.0.1:8788/healthz
          one="$(make -s llm-bridge-token)"; two="$(make -s llm-bridge-token N=2)"
          # 2 号有自己的令牌；起 2 号不动 1 号的令牌
          [ "${#two}" -ge 32 ] && [ "$one" != "$two" ] && [ "$one" = "$before" ]
          # 参数不对时拒绝，不会起出名字奇怪的项目
          ! make llm-bridge-up N=abc
          # 两个容器各用各的数据卷
          [ "$(docker inspect -f '{{range .Mounts}}{{.Name}}{{end}}' my-workspace-llm-bridge-mcp-manager-1)" = "my-workspace-llm-bridge_llm-bridge-data" ]
          [ "$(docker inspect -f '{{range .Mounts}}{{.Name}}{{end}}' my-workspace-llm-bridge-2-mcp-manager-1)" = "my-workspace-llm-bridge-2_llm-bridge-data" ]
      - name: 工作台按内部网络里的名字访问两个管理器（llm-bridge、llm-bridge-2 各指向一个容器，令牌各不相同）
        run: |
          docker compose exec -T -e ONE="$(make -s llm-bridge-token)" -e TWO="$(make -s llm-bridge-token N=2)" api python - <<'PY'
          import json, os, socket, urllib.error, urllib.request

          def status(host: str, token: str) -> int:
              request = urllib.request.Request(f"http://{host}:8787/admin/status", headers={"Authorization": f"Bearer {token}"})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      json.load(response)
                      return response.status
              except urllib.error.HTTPError as error:
                  return error.code

          addresses = {host: sorted(set(socket.gethostbyname_ex(host)[2])) for host in ("llm-bridge", "llm-bridge-2")}
          print(addresses)
          # 每个名字只指向一个容器，两个名字指向不同的容器
          assert all(len(found) == 1 for found in addresses.values()), addresses
          assert addresses["llm-bridge"] != addresses["llm-bridge-2"], addresses
          one, two = os.environ["ONE"], os.environ["TWO"]
          # 各认各的令牌：连试几次都一样（名字要是指向了两个容器，这里会时对时错）
          for _ in range(5):
              assert status("llm-bridge", one) == 200 and status("llm-bridge-2", two) == 200
              assert status("llm-bridge", two) == 401 and status("llm-bridge-2", one) == 401
          PY
      - name: 冒烟检查（两个同机部署的容器）
        run: |
          infra/llm-bridge/smoke.sh my-workspace-llm-bridge-mcp-manager-1 http://127.0.0.1:8787 "$(make -s llm-bridge-token)"
          infra/llm-bridge/smoke.sh my-workspace-llm-bridge-2-mcp-manager-1 http://127.0.0.1:8788 "$(make -s llm-bridge-token N=2)"
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: 安装浏览器验收依赖（Playwright 版本由 tests/e2e 的锁文件固定）
        working-directory: tests/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: 大模型客户端管理浏览器验收（应用中心启用；添加 1 号只控制 Claude / WorkBuddy、2 号控制 Codex / Claude / WorkBuddy；各自一套账号；改控制的平台；Claude 风险确认、设置、开发环境、会话；实例权限含只允许某个管理器；令牌不对的提示；admin 只读、member 不可见；手机宽度）
        # 不要求空库：每次新建工作台用户。地址是内部网络里的 http://llm-bridge:8787 和 http://llm-bridge-2:8787
        run: >
          LLM_BRIDGE_ADMIN_TOKEN="$(make -s llm-bridge-token)"
          LLM_BRIDGE_ADMIN_TOKEN_2="$(make -s llm-bridge-token N=2)"
          node tests/e2e/llm_bridge_browser.cjs
      - name: 验收后两个管理器都回到“控制全部平台”（脚本收尾会改回去；这里再跑一次冒烟确认）
        run: |
          infra/llm-bridge/smoke.sh my-workspace-llm-bridge-mcp-manager-1 http://127.0.0.1:8787 "$(make -s llm-bridge-token)"
          infra/llm-bridge/smoke.sh my-workspace-llm-bridge-2-mcp-manager-1 http://127.0.0.1:8788 "$(make -s llm-bridge-token N=2)"
      - name: 失败时输出服务状态与日志
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=150 api caddy web
          docker ps -a --filter name=llm-bridge
          docker logs --tail 150 my-workspace-llm-bridge-mcp-manager-1 2>&1 || true
          docker logs --tail 150 my-workspace-llm-bridge-2-mcp-manager-1 2>&1 || true
      - name: 停止服务
        if: always()
        run: |
          make llm-bridge-down N=2 || true
          make llm-bridge-down || true
          make down
