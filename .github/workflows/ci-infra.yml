name: ci-infra

# 全栈冒烟（Sprint 0 DoD）：构建镜像 → make up（等待全部健康检查）→ make migrate → make smoke；
# 之后运行各 Sprint 的全栈验收（tests/e2e：接口级与浏览器）。
# 本文件归 claude 维护（docs/decisions/2026-10-29-sprint-0-contracts.md 第 6 节）。
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: 生成 .env（随机密码与密钥）
        run: |
          make env
          # Sprint 3 验收的 A09 要等周期对账纠正投影：CI 中每分钟对账一次（默认 5 分钟）
          echo "RECONCILE_INTERVAL_MINUTES=1" >> .env
          # Sprint 4 验收用模拟 GitHub（tests/e2e/fake_github_server.py），CI 里没有真实 GitHub Token。
          # 不能用 GITHUB_API_URL：Actions 在 shell 里设置了它，Compose 插值时优先于 .env
          echo "WORKSPACE_GITHUB_API_URL=http://fake-github:8080" >> .env
          # Sprint 5 验收：Prometheus（--profile monitoring，只启动 prometheus）与模拟 n8n
          # （tests/e2e/fake_n8n_server.py）；CI 里没有真实 n8n 的凭据，Grafana 不在 CI 里启动
          sed -i 's#^PROMETHEUS_URL=.*#PROMETHEUS_URL=http://prometheus:9090#' .env
          grep -q '^PROMETHEUS_URL=http://prometheus:9090$' .env
          sed -i 's/^INTEGRATION_ALLOWED_HOSTS=.*/INTEGRATION_ALLOWED_HOSTS=vikunja,fake-github,fake-n8n/' .env
          grep -q '^INTEGRATION_ALLOWED_HOSTS=vikunja,fake-github,fake-n8n$' .env
      - name: docker compose config
        run: |
          docker compose config --quiet
          # 可选监控（Prometheus + Grafana，docs/deployment.md 第 12 节）
          docker compose --profile monitoring config --quiet
          # 独立部署的 Vikunja（infra/vikunja/compose.yaml）；在 Sprint 3 验收前启动
          docker compose -p my-workspace-vikunja -f infra/vikunja/compose.yaml --env-file .env config --quiet
      - name: 构建并启动（make up）
        run: make up
      - name: 数据库迁移（make migrate）
        run: make migrate
      - name: 冒烟检查（make smoke）
        run: make smoke
      - name: Sprint 1 全栈验收（A01 / A02 / A18 / 跨工作空间）
        # 需要空库：必须在任何创建用户的步骤之前运行；安装凭据取自 make env 生成的 .env
        run: python3 tests/e2e/sprint1_acceptance.py
      - name: Sprint 2 全栈验收（A03 / A04 / A05 / DoD，接口级）
        # 不要求空库：每次用新的邮箱写入测试用户
        run: python3 tests/e2e/sprint2_acceptance.py
      - name: 启动 Vikunja 2.7.1（make vikunja-up；加入 core 的 integrations 网络）
        run: make vikunja-up
      - name: Sprint 3 全栈验收（DoD / A05 ~ A09，接口级，真实 Vikunja）
        # 每次新建工作台用户、Vikunja 用户与项目；会临时停掉 caddy 与 vikunja（A09、A05）
        run: python3 tests/e2e/sprint3_acceptance.py
      - name: Sprint 4 全栈验收（DoD / A10 ~ A13 / A17，接口级，模拟 GitHub）
        # 模拟 GitHub 在 api 镜像里运行并加入 integrations 网络；限流与 Token 失效的检查要等约 3 分钟
        run: python3 tests/e2e/sprint4_acceptance.py
      - name: 启动 Prometheus 3.15.1（--profile monitoring，只启动 prometheus）
        run: docker compose --profile monitoring up -d --wait --wait-timeout 120 prometheus
      - name: Sprint 5 全栈验收（DoD / S5-01 ~ S5-05 / A16，接口级，Prometheus + 模拟 n8n）
        # 模拟 n8n 在 api 镜像里运行并加入 integrations 网络；要等两轮自动化对账（约 3 分钟），
        # 中途会临时停掉 prometheus
        run: python3 tests/e2e/sprint5_acceptance.py
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: 安装浏览器验收依赖（Playwright 版本由 tests/e2e 的锁文件固定）
        working-directory: tests/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Sprint 2 浏览器验收（拖拽保存刷新、版本冲突、错误卡片、viewer 只读、移动端）
        # 不要求空库：每次用新的邮箱写入测试用户
        run: node tests/e2e/sprint2_browser.cjs
      - name: Sprint 3 浏览器验收（连接 Vikunja → 新建 / 编辑 → 原生修改 → 页面更新 → 删除、viewer 只读）
        # 真实 Vikunja：每次新建工作台用户、Vikunja 用户与项目
        run: node tests/e2e/sprint3_browser.cjs
      - name: Sprint 4 浏览器验收（收藏与关联、日历、首页组件、viewer 只读、不请求 AFFiNE）
        # 不要求空库：每次用新的工作台用户；被关联的 Vikunja 任务直接写进投影
        run: node tests/e2e/sprint4_browser.cjs
      - name: Sprint 5 浏览器验收（运维页与首页运维组件、停掉 Prometheus 后显示过期、viewer 可读、不暴露监控地址）
        # 用 Sprint 5 接口级验收时启动的 prometheus；中途会临时停掉再启动它
        run: node tests/e2e/sprint5_browser.cjs
      - name: 完整端到端冒烟（make smoke-full：全部读接口与页面、核心服务、SSE、写入往返、登出）
        # 不要求空库：用新的临时用户；新增的接口（openapi.json）与页面（navigation.ts）自动纳入
        run: make smoke-full
      - name: 性能基准（基础 API P95 < 300 ms、首页 P95 < 500 ms；CI 的 runner 不稳定，允许 2 倍）
        # 结果表格同时写进本次运行的 Summary；正式数据以本机固定环境为准（docs/acceptance/sprint-6.md）
        run: |
          set -o pipefail
          python3 tests/perf/benchmark.py --tolerance 2 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 备份恢复验收（A15：make backup → 隔离环境 make restore-verify → 登录与首页配置一致）
        # 备份写入临时的本地 restic 仓库；恢复在独立的 Compose 项目（端口 18080）里进行，结束后删除
        run: python3 tests/e2e/backup_acceptance.py
      - name: 停止 Prometheus（之后的 make down 只管 core 服务）
        run: docker compose --profile monitoring rm -sf prometheus
      - name: 停止 Vikunja（之后的重启检查会删除 core 的网络）
        run: make vikunja-down
      - name: 停止后重启，确认数据卷保留
        run: |
          make down
          docker compose up -d --wait --wait-timeout 240
          # 数据卷丢失时数据库是空的，alembic current 不会输出 (head)
          docker compose exec -T api alembic current | grep -q '(head)'
          make smoke
      - name: 清空数据卷并重新迁移（Sprint 1 浏览器验收要从首次安装开始）
        run: |
          docker compose down -v
          docker compose up -d --wait --wait-timeout 240
          make migrate
      - name: Sprint 1 浏览器验收（首次安装 → 登录 → 修改设置 → 撤销会话 → 登出）
        run: node tests/e2e/sprint1_browser.cjs
      - name: 失败时输出服务状态与日志
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200
          docker compose -p my-workspace-vikunja -f infra/vikunja/compose.yaml --env-file .env \
            logs --no-color --tail=100 || true
      - name: 停止服务
        if: always()
        run: |
          make vikunja-down || true
          make down

  # V2 OpenClaw（T-0059，OC-7）：接入入口验收（Caddy 接入入口 + 本机隧道 + 双向证书），
  # 然后是多实例端到端（OpenIM + 两个真实 OpenClaw 实例 + 假模型，方案第 8 节）。
  # 与 compose job 并行；测试证书在这里生成，用完即丢。
  agents:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - name: 腾出磁盘空间（OpenIM 补丁镜像的构建约 8 GB 临时空间，OpenClaw 镜像约 3 GB）
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: 生成 .env 与接入入口的测试证书
        run: |
          make env
          tls="$RUNNER_TEMP/agent-tls"
          mkdir -p "$tls"
          for name in intranet public; do
            openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 2 \
              -subj "/CN=$name.test" -addext "subjectAltName=DNS:$name.test" \
              -keyout "$tls/$name.key" -out "$tls/$name.crt" 2>/dev/null
          done
          # agent-gateway 去掉了全部 capability，读不了别的用户 0600 的文件；这是只在 CI 里用的测试密钥
          chmod 644 "$tls"/*
          cat "$tls/intranet.crt" "$tls/public.crt" > "$RUNNER_TEMP/agent-server-ca.pem"
          set_env() { sed -i "s#^$1=.*#$1=$2#" .env; grep -qx "$1=$2" .env || echo "$1=$2" >> .env; }
          set_env AGENT_TLS_DIR "$tls"
          set_env AGENT_INTRANET_HOST intranet.test
          set_env AGENT_PUBLIC_HOST public.test
          set_env AGENT_INTRANET_URL https://intranet.test:8443
          set_env AGENT_PUBLIC_URL https://public.test:9443
          # OpenIM（docs/deployment.md 第 17 节）：api / worker 经 im 网络访问 OpenIM REST 与 Garage
          set_env OPENIM_API_URL http://openim-server:10002
          set_env OPENIM_OBJECT_URL http://garage:3900
          docker compose --profile agents config --quiet
      - name: 构建打过补丁的 OpenIM 镜像（make openim-build）
        run: make openim-build
      - name: 构建并启动（make up）
        run: make up
      - name: 数据库迁移（make migrate）
        run: make migrate
      - name: 启动接入入口（make agents-up：导出内部 CA，启动 agent-gateway）
        run: make agents-up
      - name: 接入入口验收（内网 / 外网入口、双向证书、本机隧道、/mcp、入口错配、吊销、伪造请求头）
        run: |
          python3 tests/e2e/agent_ingress_acceptance.py --server-ca "$RUNNER_TEMP/agent-server-ca.pem" \
            --intranet intranet.test:8443 --public public.test:9443
      - name: 启动 OpenIM（make openim-up）
        run: make openim-up
      - name: 多实例端到端（方案第 8 节：两个真实 OpenClaw 实例 + 假模型，内网直连与外网隧道）
        run: |
          # 要以 root 运行：接入包目录交给容器里的 uid 1000（CHECKLIST.md 的做法）
          sudo -E python3 tests/e2e/agents_acceptance.py --server-ca "$RUNNER_TEMP/agent-server-ca.pem" \
            --intranet intranet.test:8443 --public public.test:9443
      - name: A15 恢复演练含 OpenIM（上一步留下的消息、好友与群随快照恢复，数量一致）
        run: python3 tests/e2e/backup_acceptance.py --expect-openim
      - name: 失败时输出服务状态与日志
        if: failure()
        run: |
          docker compose --profile agents ps -a
          docker compose --profile agents logs --no-color --tail=200
          docker compose -p my-workspace-openim -f infra/openim/compose.yaml --env-file .env logs --no-color --tail=150 || true
      - name: 停止服务
        if: always()
        run: |
          make openim-down || true
          docker compose --profile agents down -v
