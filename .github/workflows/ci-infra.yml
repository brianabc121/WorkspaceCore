name: ci-infra

# 全栈冒烟（Sprint 0 DoD）：构建镜像 → make up（等待全部健康检查）→ make migrate → make smoke；
# 之后运行各 Sprint 的全栈验收（tests/e2e：接口级与浏览器）。
# 本文件归 claude 维护（docs/decisions/2026-10-29-sprint-0-contracts.md 第 6 节）。
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: 生成 .env（随机密码与密钥）
        run: |
          make env
          # Sprint 4 验收要等周期对账（GitHub 限流、Token 失效）：CI 中每分钟对账一次（默认 5 分钟）
          echo "RECONCILE_INTERVAL_MINUTES=1" >> .env
          # Sprint 4 验收用模拟 GitHub（tests/e2e/fake_github_server.py），CI 里没有真实 GitHub Token。
          # 不能用 GITHUB_API_URL：Actions 在 shell 里设置了它，Compose 插值时优先于 .env
          echo "WORKSPACE_GITHUB_API_URL=http://fake-github:8080" >> .env
          # Sprint 5 验收：Prometheus（--profile monitoring，只启动 prometheus）；Grafana 不在 CI 里启动
          sed -i 's#^PROMETHEUS_URL=.*#PROMETHEUS_URL=http://prometheus:9090#' .env
          grep -q '^PROMETHEUS_URL=http://prometheus:9090$' .env
          # 插拔式模块与侧栏验收（T-0161）：嵌入页的来源（Caddy 的 CSP frame-src 与接口校验共用）
          sed -i 's#^EMBED_ORIGINS=.*#EMBED_ORIGINS=https://example.com#' .env
          grep -q '^EMBED_ORIGINS=https://example.com$' .env
          sed -i 's/^INTEGRATION_ALLOWED_HOSTS=.*/INTEGRATION_ALLOWED_HOSTS=fake-github/' .env
          grep -q '^INTEGRATION_ALLOWED_HOSTS=fake-github$' .env
      - name: docker compose config
        run: |
          docker compose config --quiet
          # 可选监控（Prometheus + Grafana，docs/deployment.md 第 12 节）
          docker compose --profile monitoring config --quiet
      - name: 构建并启动（make up）
        run: make up
      - name: 数据库迁移（make migrate）
        run: make migrate
      - name: 冒烟检查（make smoke）
        run: make smoke
      - name: Sprint 1 全栈验收（A01 / A02 / A18 / 跨工作空间）
        # 需要空库：必须在任何创建用户的步骤之前运行；安装凭据取自 make env 生成的 .env
        run: python3 tests/e2e/sprint1_acceptance.py
      - name: Sprint 2 全栈验收（A03 / A04 / A05 / DoD，接口级）
        # 不要求空库：每次用新的邮箱写入测试用户
        run: python3 tests/e2e/sprint2_acceptance.py
      - name: 项目与任务全栈验收（T-0082 起由工作台自己管理：A06 / A07、version、权限、搜索、首页）
        # 不要求空库：每次新建工作台用户
        run: python3 tests/e2e/sprint3_acceptance.py
      - name: Sprint 4 全栈验收（DoD / A10 ~ A13 / A17，接口级，模拟 GitHub）
        # 模拟 GitHub 在 api 镜像里运行并加入 integrations 网络；限流与 Token 失效的检查要等约 3 分钟
        run: python3 tests/e2e/sprint4_acceptance.py
      - name: 启动 Prometheus 3.15.1（--profile monitoring，只启动 prometheus）
        run: docker compose --profile monitoring up -d --wait --wait-timeout 120 prometheus
      - name: Sprint 5 全栈验收（DoD / S5-01 ~ S5-05 / A16，接口级，Prometheus）
        # 中途会临时停掉 prometheus，验证指标过期和恢复
        run: python3 tests/e2e/sprint5_acceptance.py
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: 安装浏览器验收依赖（Playwright 版本由 tests/e2e 的锁文件固定）
        working-directory: tests/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Sprint 2 浏览器验收（拖拽保存刷新、版本冲突、错误卡片、viewer 只读、移动端）
        # 不要求空库：每次用新的邮箱写入测试用户
        run: node tests/e2e/sprint2_browser.cjs
      - name: 项目与任务浏览器验收（新建项目 → 新建 / 编辑任务 → 看板 → 首页 → 删除 → 归档 / 删除项目、viewer 只读）
        # 不要求空库：每次新建工作台用户
        run: node tests/e2e/sprint3_browser.cjs
      - name: Sprint 4 浏览器验收（收藏与关联、日历、首页组件、viewer 只读、不请求 AFFiNE）
        # 不要求空库：每次用新的工作台用户；被关联的任务直接写进工作台的任务表
        run: node tests/e2e/sprint4_browser.cjs
      - name: Sprint 5 浏览器验收（运维页与首页运维组件、停掉 Prometheus 后显示过期、viewer 可读、不暴露监控地址）
        # 用 Sprint 5 接口级验收时启动的 prometheus；中途会临时停掉再启动它
        run: node tests/e2e/sprint5_browser.cjs
      - name: 知识库浏览器验收（知识图谱、[[ 补全与链接、版本冲突三方合并、回收站、项目知识库主页与趋势图、图片上传 / 粘贴 / 显示 / 清理、手机宽度、viewer 只读）
        # 不要求空库：每次新建工作台用户；笔记与项目经工作台接口建（T-0100、T-0103、T-0106）
        run: node tests/e2e/knowledge_browser.cjs
      - name: 时间轴浏览器验收（任务页 / 项目页入口、全部与按项目、智能体的一段与 token、开始暂停、拖动计划、执行记录、手机宽度、viewer 只读）
        # 不要求空库：每次新建工作台用户；Compose 里没有真实 OpenClaw，“智能体执行过的一段”由 seed.py 写入（T-0106）
        run: node tests/e2e/timeline_browser.cjs
      - name: README 与 Issues 浏览器验收（README 自动更新的部分、页面上开 Issue、沟通部分自动列出、评论与关闭、手机宽度、viewer 只读）
        # 不要求空库：每次新建工作台用户；智能体读写 README、评论 Issue 在 agents 任务的场景 25（真实 OpenClaw，T-0125）
        run: node tests/e2e/readme_issues_browser.cjs
      - name: 插拔式模块与侧栏浏览器验收（应用中心停用 / 启用新闻早报、功能未启用页、自定义分组与页面、嵌入页与 CSP、member 只读、手机宽度）
        # 不要求空库：每次新建工作台用户（T-0159 ~ T-0161）
        run: node tests/e2e/modules_browser.cjs
      - name: 首页浏览器验收（工作概况、任务进展与确认结果、我的待办、提醒与日程、恢复默认首页、viewer 只读、手机宽度）
        # 不要求空库：每次新建工作台用户；没有真实 OpenClaw，“智能体完成的任务”由 seed.py review 写入（T-0165）
        run: node tests/e2e/home_browser.cjs
      - name: 完整端到端冒烟（make smoke-full：全部读接口与页面、核心服务、SSE、写入往返、登出）
        # 不要求空库：用新的临时用户；新增的接口（openapi.json）与页面（navigation.ts）自动纳入
        run: make smoke-full
      - name: 性能基准（基础 API P95 < 300 ms、首页 P95 < 500 ms；CI 的 runner 不稳定，允许 2 倍）
        # 结果表格同时写进本次运行的 Summary；正式数据以本机固定环境为准（docs/acceptance/sprint-6.md）
        run: |
          set -o pipefail
          python3 tests/perf/benchmark.py --tolerance 2 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 备份恢复验收（A15：make backup → 隔离环境 make restore-verify → 登录与首页配置一致）
        # 备份写入临时的本地 restic 仓库；恢复在独立的 Compose 项目（端口 18080）里进行，结束后删除
        run: python3 tests/e2e/backup_acceptance.py
      - name: 停止 Prometheus（之后的 make down 只管 core 服务）
        run: docker compose --profile monitoring rm -sf prometheus
      - name: 停止后重启，确认数据卷保留
        run: |
          make down
          docker compose up -d --wait --wait-timeout 240
          # 数据卷丢失时数据库是空的，alembic current 不会输出 (head)
          docker compose exec -T api alembic current | grep -q '(head)'
          make smoke
      - name: 清空数据卷并重新迁移（Sprint 1 浏览器验收要从首次安装开始）
        run: |
          docker compose down -v
          docker compose up -d --wait --wait-timeout 240
          make migrate
      - name: Sprint 1 浏览器验收（首次安装 → 登录 → 修改设置 → 撤销会话 → 登出）
        run: node tests/e2e/sprint1_browser.cjs
      - name: 失败时输出服务状态与日志
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200
      - name: 停止服务
        if: always()
        run: make down

  # 新闻早报（T-0155，docs/v2/NEWS_PLAN.md 第 12 节）：真实的 TrendRadar 6.11.0 与 MCP 4.1.1（锁定 digest），
  # 外部依赖（NewsNow、RSS、大模型、推送接收）换成 tests/e2e/fake_news_server.py；与 compose job 并行。
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: 生成 .env（新闻早报：部署了 TrendRadar、每分钟运行一次、允许模拟服务的主机名）
        run: |
          make env
          sed -i 's#^TRENDRADAR_MCP_URL=.*#TRENDRADAR_MCP_URL=http://trendradar-mcp:3333/mcp#' .env
          sed -i 's/^TRENDRADAR_CRON=.*/TRENDRADAR_CRON=* * * * */' .env
          sed -i 's/^NEWS_ALLOWED_HOSTS=.*/NEWS_ALLOWED_HOSTS=fake-news/' .env
          grep -q '^TRENDRADAR_MCP_URL=http://trendradar-mcp:3333/mcp$' .env
          grep -q '^NEWS_ALLOWED_HOSTS=fake-news$' .env
      - name: docker compose config（core 与 TrendRadar）
        run: |
          docker compose config --quiet
          WORKSPACE_PROJECT=my-workspace docker compose -p my-workspace-trendradar \
            -f infra/trendradar/compose.yaml --env-file .env config --quiet
      - name: 构建并启动（make up）
        run: make up
      - name: 数据库迁移（make migrate）
        run: make migrate
      - name: 启动新闻早报（make trendradar-pull、make trendradar-up：按锁定的提交下载并校验 AI 提示词）
        run: |
          make trendradar-pull
          make trendradar-up
      - name: 新闻早报全栈验收（设置 → 配置文件 → 抓取筛选 AI 分析推送 → 入库通知；MCP 查询与智能体工具；改关键词；不对外暴露）
        run: python3 tests/e2e/news_acceptance.py
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: 安装浏览器验收依赖（Playwright 版本由 tests/e2e 的锁文件固定）
        working-directory: tests/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: 新闻早报浏览器验收（设置页、早报页各标签、收藏与不感兴趣、首页面板、手机宽度、viewer 只读）
        run: node tests/e2e/news_browser.cjs
      - name: 失败时输出服务状态与日志
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200 api worker
          WORKSPACE_PROJECT=my-workspace docker compose -p my-workspace-trendradar \
            -f infra/trendradar/compose.yaml --env-file .env logs --no-color --tail=200
      - name: 停止服务
        if: always()
        run: |
          make trendradar-down || true
          make down

  # V2 OpenClaw（T-0059，OC-7）：接入入口验收（Caddy 接入入口 + 本机隧道 + 双向证书），
  # 然后是多实例端到端（OpenIM + 两个真实 OpenClaw 实例 + 假模型，方案第 8 节）。
  # 与 compose job 并行；测试证书在这里生成，用完即丢。
  agents:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v5
      - name: 腾出磁盘空间（OpenIM 补丁镜像的构建约 8 GB 临时空间，OpenClaw 镜像约 3 GB）
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: 生成 .env 与接入入口的测试证书
        run: |
          make env
          tls="$RUNNER_TEMP/agent-tls"
          mkdir -p "$tls"
          for name in intranet public; do
            openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 2 \
              -subj "/CN=$name.test" -addext "subjectAltName=DNS:$name.test" \
              -keyout "$tls/$name.key" -out "$tls/$name.crt" 2>/dev/null
          done
          # agent-gateway 去掉了全部 capability，读不了别的用户 0600 的文件；这是只在 CI 里用的测试密钥
          chmod 644 "$tls"/*
          cat "$tls/intranet.crt" "$tls/public.crt" > "$RUNNER_TEMP/agent-server-ca.pem"
          set_env() { sed -i "s#^$1=.*#$1=$2#" .env; grep -qx "$1=$2" .env || echo "$1=$2" >> .env; }
          set_env AGENT_TLS_DIR "$tls"
          set_env AGENT_INTRANET_HOST intranet.test
          set_env AGENT_PUBLIC_HOST public.test
          set_env AGENT_INTRANET_URL https://intranet.test:8443
          set_env AGENT_PUBLIC_URL https://public.test:9443
          # OpenIM（docs/deployment.md 第 17 节）：api / worker 经 im 网络访问 OpenIM REST 与 Garage
          set_env OPENIM_API_URL http://openim-server:10002
          set_env OPENIM_OBJECT_URL http://garage:3900
          # Gmail（T-0131，场景 23）：模拟 Google（tests/e2e/fake_gmail_server.py）在 integrations 网络里叫 fake-gmail
          set_env GOOGLE_OAUTH_TOKEN_URL http://fake-gmail:8080/token
          set_env GOOGLE_OAUTH_REVOKE_URL http://fake-gmail:8080/revoke
          set_env GMAIL_API_URL http://fake-gmail:8080
          set_env INTEGRATION_ALLOWED_HOSTS fake-gmail
          docker compose --profile agents config --quiet
      # T-0141：场景 26 把这台 runner 当运行服务器。接入包的 install-gvisor.sh 第一次安装时会重启 Docker，
      # 所以在启动任何服务之前用同一个脚本装好（核对 sha512）；之后 install.sh 再运行时 Docker 已认得 runsc，不再重启
      - name: 安装 gVisor release-20261019.0（运行服务器验收用，接入包里的同一个脚本）
        run: |
          sudo bash services/api/app/runner_bundle/files/install-gvisor.sh
          image="$(python3 -c 'import sys; sys.path.insert(0, "services/api"); from app.runner_bundle import AGENT_IMAGE; print(AGENT_IMAGE)')"
          docker info --format '{{json .Runtimes}}'
          echo "宿主内核：$(uname -r)"
          docker run --rm --runtime=runsc --network none "$image" \
            python -c 'import os, platform; print("gVisor 里的内核：", os.uname().release, platform.machine())'
          docker run --rm --runtime=runsc --network none "$image" sh -c 'dmesg 2>&1 | head -n 3' || true
      - name: 构建打过补丁的 OpenIM 镜像（make openim-build）
        run: make openim-build
      - name: 构建并启动（make up）
        run: make up
      - name: 数据库迁移（make migrate）
        run: make migrate
      - name: 启动接入入口（make agents-up：导出内部 CA，启动 agent-gateway）
        run: make agents-up
      - name: 接入入口验收（内网 / 外网入口、双向证书、本机隧道、/mcp、入口错配、吊销、伪造请求头）
        run: |
          python3 tests/e2e/agent_ingress_acceptance.py --server-ca "$RUNNER_TEMP/agent-server-ca.pem" \
            --intranet intranet.test:8443 --public public.test:9443
      - name: 启动 OpenIM（make openim-up）
        run: make openim-up
      - name: 多实例端到端（方案第 8 节：两个真实 OpenClaw 实例 + 假模型，内网直连与外网隧道；场景 15 是知识库与每晚复盘（T-0100），场景 23 是 Gmail（T-0131），场景 26 是容器服务器（T-0141；容器读数 T-0188））
        run: |
          # 要以 root 运行：接入包目录交给容器里的 uid 1000（CHECKLIST.md 的做法）。
          # npm 缓存放到临时目录：用 runner 的 ~/.npm 会留下 root 所有的文件，后面的 npm ci 会因 EACCES 失败
          sudo -E env npm_config_cache="$RUNNER_TEMP/npm-root-cache" \
            python3 tests/e2e/agents_acceptance.py --server-ca "$RUNNER_TEMP/agent-server-ca.pem" \
            --intranet intranet.test:8443 --public public.test:9443
      - name: A15 恢复演练含 OpenIM（上一步留下的消息、好友与群随快照恢复，数量一致）
        run: python3 tests/e2e/backup_acceptance.py --expect-openim
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: 安装浏览器验收依赖（Playwright 版本由 tests/e2e 的锁文件固定）
        working-directory: tests/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: V2 浏览器验收（密钥库、实例页、通讯录与单聊、导出、建群、IM 审批卡片、审批中心、移动端、member 不可见）
        # 真实 OpenIM；每次用新的工作台用户，登记的实例不需要在线，结束时在页面上停用
        run: node tests/e2e/sprint6_browser.cjs
      - name: 邮件页浏览器验收（T-0170 / T-0171：默认全部邮箱、同 ID 的邮件不串号、回复只经所属邮箱；模拟 Google）
        # 上面已把 GOOGLE_* / GMAIL_API_URL 指向 fake-gmail；脚本自己启动模拟 Google 并在结束时删除
        run: node tests/e2e/mail_browser.cjs
      # T-0088：放在最后，因为它把外网入口换成了内部 CA 签发的证书与内部主机名（前面的验收用的是 public.test）
      - name: 一键配置接入入口（deploy.sh connect 的“OpenClaw 接入入口”一步：没有域名 → 内部主机名 + 本机出站地址）
        run: |
          # 模拟第一次配置：去掉上面手动配置的外网入口；“配置接入入口？”回答是，其余问题取默认值
          sed -i -e 's#^AGENT_PUBLIC_URL=.*#AGENT_PUBLIC_URL=#' -e 's#^AGENT_PUBLIC_HOST=.*#AGENT_PUBLIC_HOST=#' .env
          bash -c "$(sed '$d' scripts/deploy.sh)"'
          confirm() { return 0; }
          PY=python3 ROOT="$PWD"
          connect_agent_ingress' 2>&1 | tee "$RUNNER_TEMP/agent-ingress.log"
          grep -q "接入入口已就绪" "$RUNNER_TEMP/agent-ingress.log"
          grep '^AGENT_PUBLIC_' .env
      - name: 接入入口自动配置验收（原样的接入包：内部 CA + 地址映射，经本机隧道连回工作台）
        run: sudo -E python3 tests/e2e/agent_auto_ingress_acceptance.py
      # T-0089 B3：把 runner 自己当成一台“新服务器”——另起一个 sshd（2222），账号要 sudo 密码、不在 docker 组，
      # 工作台经外网入口的地址（AGENT_PUBLIC_ADDRESS）连过来，全程用保存的（加密的）登录密码，从初始化一路部署到真实的 OpenClaw 上线（T-0183）
      - name: SSH 自动部署验收准备（本机 sshd：专用账号，sudo 要密码，不在 docker 组）
        run: |
          command -v /usr/sbin/sshd >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq openssh-server >/dev/null; }
          PW="$(openssl rand -hex 16)"
          echo "::add-mask::$PW"
          echo "SSH_TARGET_PASSWORD=$PW" >> "$GITHUB_ENV"
          sudo useradd -m -s /bin/bash -G sudo mwdeploy
          echo "mwdeploy:$PW" | sudo chpasswd
          ADDR="$(sed -n 's/^AGENT_PUBLIC_ADDRESS=//p' .env)"
          test -n "$ADDR"
          D=/etc/ssh/e2e
          sudo mkdir -p "$D" /run/sshd
          sudo ssh-keygen -q -t ed25519 -N '' -f "$D/host_ed25519"
          printf '%s\n' "Port 2222" "ListenAddress $ADDR" "HostKey $D/host_ed25519" "PidFile $D/sshd.pid" \
            "PasswordAuthentication yes" "KbdInteractiveAuthentication no" "PubkeyAuthentication yes" \
            "PermitRootLogin no" "UsePAM yes" "AllowUsers mwdeploy" "Subsystem sftp internal-sftp" \
            | sudo tee "$D/sshd_config" >/dev/null
          sudo /usr/sbin/sshd -t -f "$D/sshd_config"
          sudo /usr/sbin/sshd -f "$D/sshd_config" -E "$RUNNER_TEMP/sshd.log"
          { echo "SSH_TARGET_HOST=$ADDR"; echo "SSH_TARGET_PORT=2222"; echo "SSH_TARGET_USER=mwdeploy"; \
            echo "SSH_HOST_KEY_PUB=$D/host_ed25519.pub"; } >> "$GITHUB_ENV"
      - name: 智能体服务器 SSH 验收（四项添加、密码加密保存、指纹确认、错误密码、初始化加入 docker 组、一次点击部署两个真实 OpenClaw、重部署、保留数据卸载、旧公钥退役）
        run: sudo -E python3 tests/e2e/agent_ssh_acceptance.py
      # T-0090 / T-0183：同一台“新服务器”（上一步已卸载、移除服务器并恢复 authorized_keys），这次全程在网页上操作
      - name: 智能体服务器浏览器验收（服务器页四项添加、核对指纹、测试连接、初始化，智能体页选服务器部署到上线、运维、卸载、移除、手机宽度）
        run: node tests/e2e/agent_ssh_browser.cjs
      # T-0141：同一台“新服务器”（上一步已卸载 OpenClaw 并移除服务器），这次在网页上把它部署成运行服务器（外网入口：
      # 内部 CA + 地址映射，原样的接入包）；场景 26 已用接入包手动部署验收过环境与运行，这里验收页面与 SSH 部署
      - name: 容器服务器浏览器验收（添加服务器、SSH 部署到上线、容器总览与主机条、旧链接与详情直链、各标签、卸载、吊销、手机宽度）
        run: node tests/e2e/runner_browser.cjs
      - name: 失败时输出服务状态与日志
        if: failure()
        run: |
          sudo tail -n 80 "$RUNNER_TEMP/sshd.log" 2>/dev/null || true
          docker logs --tail 200 myworkspace-runner-agent 2>&1 || true
          docker compose --profile agents ps -a
          docker compose --profile agents logs --no-color --tail=200
          docker compose -p my-workspace-openim -f infra/openim/compose.yaml --env-file .env logs --no-color --tail=150 || true
      - name: 停止服务
        if: always()
        run: |
          make openim-down || true
          docker compose --profile agents down -v

  # T-0089：SSH 自动部署用的 Docker 安装脚本，在支持的三个发行版的干净容器里真正运行一次：
  # 核对官方软件源的签名公钥指纹，装上锁定版本并 hold（容器里没有 init，最后按预期以 docker_not_running 结束）
  docker-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "ubuntu:22.04", "ubuntu:24.04"]
    steps:
      - uses: actions/checkout@v5
      - name: 在 ${{ matrix.image }} 里运行 install-docker.sh
        run: |
          docker run --rm -v "$PWD/services/api/app/agent_provisioning/files/install-docker.sh:/install-docker.sh:ro" \
            "${{ matrix.image }}" bash -c '
              bash /install-docker.sh ""; echo "exit=$?"
              dpkg-query -W -f="\${Package}=\${Version}\n" docker-ce docker-ce-cli containerd.io docker-compose-plugin
              echo "held: $(apt-mark showhold | sort | tr "\n" " ")"
            ' 2>&1 | tee "$RUNNER_TEMP/out.log"
          python3 - "$RUNNER_TEMP/out.log" <<'PY'
          import re, sys
          text = open(sys.argv[1], encoding="utf-8").read()
          script = open("services/api/app/agent_provisioning/files/install-docker.sh", encoding="utf-8").read()
          pins = dict(re.findall(r'"(docker-ce|docker-ce-cli|containerd\.io|docker-compose-plugin)=([^"~]+)~\$\{suffix\}"', script))
          assert len(pins) == 4, pins
          assert "exit=5" in text and "docker_not_running" in text, "脚本应装完并因为容器里没有守护进程以 5 退出"
          for name, version in pins.items():
              assert re.search(rf"^{re.escape(name)}={re.escape(version)}~", text, re.M), f"{name} 不是锁定版本 {version}"
          held = text.split("held: ", 1)[1].split()
          assert sorted(held) == sorted(pins), f"没有全部 hold：{held}"
          print("锁定版本与 hold 都正确：", pins)
          PY

