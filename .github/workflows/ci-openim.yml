name: ci-openim

# 打过补丁的 OpenIM（V2 OC-3，T-0055）：构建自建镜像 → 启动 infra/openim 全套 → 越权回归测试。
# ADR：docs/decisions/2026-10-31-v2-oc0-openclaw-openim-verification.md 第 6 节——
# infra/openim/probes/rest-authz.py 对补丁镜像必须以 0 退出（REST 与 WebSocket 都挡住）。
# 只在 OpenIM 相关文件变化时运行。本文件归 claude 维护。
on:
  pull_request:
    paths:
      - "infra/openim/**"
      - ".github/workflows/ci-openim.yml"
  push:
    branches: [main]
    paths:
      - "infra/openim/**"
      - ".github/workflows/ci-openim.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.23.4"
      - name: 构建补丁镜像
        run: infra/openim/server/build.sh
      - name: 生成 infra/openim/.env（随机密码）
        run: |
          umask 077
          {
            for v in OPENIM_SECRET OPENIM_MONGO_ROOT_PASSWORD OPENIM_MONGO_PASSWORD OPENIM_REDIS_PASSWORD OPENIM_MINIO_SECRET; do
              echo "$v=$(openssl rand -hex 16)"
            done
            echo "OPENIM_WEBHOOK_URL=http://webhook-stub:10006"
          } > infra/openim/.env
      - name: 启动 OpenIM
        run: |
          docker compose -p my-workspace-openim -f infra/openim/compose.yaml -f infra/openim/compose.probe.yaml \
            --env-file infra/openim/.env up -d
          # 冷启动要等 mage 拉起全部服务；get_admin_token 能返回 errCode 0 才算就绪
          set -a; . infra/openim/.env; set +a
          for i in $(seq 1 90); do
            body="{\"secret\":\"$OPENIM_SECRET\",\"userID\":\"imAdmin\"}"
            if curl -fsS -m 5 -H 'Content-Type: application/json' -H "operationID: ci$i" \
                 -d "$body" http://127.0.0.1:10002/auth/get_admin_token 2>/dev/null | grep -q '"errCode":0'; then
              echo "OpenIM 就绪（第 $i 次）"; exit 0
            fi
            sleep 5
          done
          echo "OpenIM 没有在 7.5 分钟内就绪" >&2; exit 1
      - name: 越权回归测试（必须以 0 退出）
        run: |
          set -a; . infra/openim/.env; set +a
          # 消息网关在 10001 上接受 WebSocket，再等它就绪
          for i in $(seq 1 30); do (exec 3<>/dev/tcp/127.0.0.1/10001) 2>/dev/null && break; sleep 2; done
          python3 -I infra/openim/probes/rest-authz.py --api http://127.0.0.1:10002 --secret "$OPENIM_SECRET"
      - name: 失败时的日志
        if: failure()
        run: |
          docker compose -p my-workspace-openim -f infra/openim/compose.yaml -f infra/openim/compose.probe.yaml \
            --env-file infra/openim/.env ps
          docker compose -p my-workspace-openim -f infra/openim/compose.yaml -f infra/openim/compose.probe.yaml \
            --env-file infra/openim/.env logs --tail 200 openim-server
      - name: 清理
        if: always()
        run: |
          docker compose -p my-workspace-openim -f infra/openim/compose.yaml -f infra/openim/compose.probe.yaml \
            --env-file infra/openim/.env down -v || true
          rm -f infra/openim/.env
