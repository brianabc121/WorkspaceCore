# My Workspace core 服务（docs/DEVELOPMENT_SPEC.md 第 11.1 节）：web、api、worker、postgres、redis、caddy。
# 启动：make up；迁移：make migrate；停止：make down（保留数据卷）。运行手册见 docs/deployment.md。
#
# 网络：backend 为内部网络（不通外网），postgres / redis 只在这里；对外只有 caddy 一个端口。
# 所有镜像固定具体版本，不使用 latest。

name: my-workspace

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-api-image: &api-image
  build:
    context: services/api
  image: my-workspace-api:local

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # 由 POSTGRES_* 拼接，避免与数据库密码不一致；密码只用字母和数字（make env 生成的就是）
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-workspace}:${POSTGRES_PASSWORD:?请先运行 make env 生成 .env}@postgres:5432/${POSTGRES_DB:-workspace}
  REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: postgres:16.15-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workspace}
      POSTGRES_USER: ${POSTGRES_USER:-workspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先运行 make env 生成 .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]
    logging: *logging

  redis:
    image: redis:7.4.12-alpine3.21
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]
    logging: *logging

  api:
    <<: [*api-image, *hardening]
    restart: unless-stopped
    environment:
      <<: *api-env
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      SESSION_SECRET: ${SESSION_SECRET:?请先运行 make env 生成 .env}
      # 未配置时首次安装接口一律拒绝；make setup-token 查看
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      # 第三方连接凭证的加密密钥；格式错误时 API 拒绝启动
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      # Connector 默认拒绝私有地址（SSRF 防护）；这里显式允许 integrations 网络里的 Vikunja 容器
      INTEGRATION_ALLOWED_HOSTS: ${INTEGRATION_ALLOWED_HOSTS:-vikunja}
      # API 只能经 Caddy 访问，取 X-Forwarded-For 最右侧的地址作为客户端 IP（登录限流用）
      TRUST_FORWARDED_FOR: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    # frontend 网络供 caddy 访问，也给 Connector 访问外网；integrations 连到独立部署的第三方服务（Vikunja 等）
    networks: [backend, frontend, integrations]
    logging: *logging

  worker:
    <<: [*api-image, *hardening]
    restart: unless-stopped
    command: ["arq", "app.jobs.worker.WorkerSettings", "--custom-log-dict", "app.jobs.worker.LOG_CONFIG"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "arq", "app.jobs.worker.WorkerSettings", "--check"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    # Worker 经 integrations 访问同机部署的第三方服务；连接外部托管的服务需要出网时再接入 frontend 网络
    networks: [backend, integrations]
    logging: *logging

  web:
    <<: *hardening
    build:
      context: apps/web
    image: my-workspace-web:local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [frontend]
    logging: *logging

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      # 默认只绑定本机；在服务器上对外提供服务时，把 .env 里的 HTTP_BIND 改为 0.0.0.0 并配置 HTTPS
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # 官方镜像给 caddy 二进制设置了 cap_net_bind_service 文件能力，缺少它会无法启动
      - NET_BIND_SERVICE
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    # integrations：第三方服务经此把 Webhook 发到 /api/v1/webhooks/…（不经过对外端口）
    networks: [frontend, integrations]
    logging: *logging

networks:
  backend:
    internal: true
  frontend: {}
  # 与独立部署的第三方服务（infra/vikunja/compose.yaml 等）互通的受控网络：只有 api、worker、caddy 加入，
  # 第三方服务碰不到 backend 里的 PostgreSQL / Redis；internal 表示这个网络本身不提供出网
  integrations:
    internal: true

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
