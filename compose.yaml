# My Workspace core 服务（docs/DEVELOPMENT_SPEC.md 第 11.1 节）：web、api、worker、postgres、redis、caddy。
# 启动：make up；迁移：make migrate；停止：make down（保留数据卷）。运行手册见 docs/deployment.md。
#
# 网络：backend 为内部网络（不通外网），postgres / redis 只在这里；对外只有 caddy 一个端口。
# 所有镜像固定具体版本，不使用 latest。

name: my-workspace

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-api-image: &api-image
  build:
    context: services/api
  image: my-workspace-api:local

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # 由 POSTGRES_* 拼接，避免与数据库密码不一致；密码只用字母和数字（make env 生成的就是）
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-workspace}:${POSTGRES_PASSWORD:?请先运行 make env 生成 .env}@postgres:5432/${POSTGRES_DB:-workspace}
  REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: postgres:16.15-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workspace}
      POSTGRES_USER: ${POSTGRES_USER:-workspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先运行 make env 生成 .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]
    logging: *logging

  redis:
    image: redis:7.4.12-alpine3.21
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]
    logging: *logging

  api:
    <<: [*api-image, *hardening]
    restart: unless-stopped
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    # frontend 网络供 caddy 访问，也给之后的 Connector 留出访问外网的出口
    networks: [backend, frontend]
    logging: *logging

  worker:
    <<: [*api-image, *hardening]
    restart: unless-stopped
    command: ["arq", "app.jobs.worker.WorkerSettings", "--custom-log-dict", "app.jobs.worker.LOG_CONFIG"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "arq", "app.jobs.worker.WorkerSettings", "--check"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    # Sprint 0 的 Worker 不需要外网；Sprint 3 起 Connector 同步需要出口时再接入 frontend 网络
    networks: [backend]
    logging: *logging

  web:
    <<: *hardening
    build:
      context: apps/web
    image: my-workspace-web:local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [frontend]
    logging: *logging

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      # 默认只绑定本机；在服务器上对外提供服务时，把 .env 里的 HTTP_BIND 改为 0.0.0.0 并配置 HTTPS
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # 官方镜像给 caddy 二进制设置了 cap_net_bind_service 文件能力，缺少它会无法启动
      - NET_BIND_SERVICE
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks: [frontend]
    logging: *logging

networks:
  backend:
    internal: true
  frontend: {}

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
