# My Workspace core 服务（docs/DEVELOPMENT_SPEC.md 第 11.1 节）：web、api、worker、postgres、redis、caddy。
# 启动：make up；迁移：make migrate；停止：make down（保留数据卷）。运行手册见 docs/deployment.md。
#
# 网络：backend 为内部网络（不通外网），postgres / redis 只在这里；对外只有 caddy 一个端口。
# 所有镜像固定具体版本，不使用 latest。
# 可选监控（Prometheus + Grafana）：docker compose --profile monitoring up -d，见 docs/deployment.md 第 12 节。

name: my-workspace

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-api-image: &api-image
  build:
    context: services/api
  image: my-workspace-api:local

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # 由 POSTGRES_* 拼接，避免与数据库密码不一致；密码只用字母和数字（make env 生成的就是）
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-workspace}:${POSTGRES_PASSWORD:?请先运行 make env 生成 .env}@postgres:5432/${POSTGRES_DB:-workspace}
  REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: postgres:16.15-alpine3.24@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workspace}
      POSTGRES_USER: ${POSTGRES_USER:-workspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先运行 make env 生成 .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]
    logging: *logging

  redis:
    image: redis:7.4.12-alpine3.21@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]
    logging: *logging

  api:
    <<: [*api-image, *hardening]
    restart: unless-stopped
    environment:
      <<: *api-env
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      SESSION_SECRET: ${SESSION_SECRET:?请先运行 make env 生成 .env}
      # 未配置时首次安装接口一律拒绝；make setup-token 查看
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      # 第三方连接凭证的加密密钥；格式错误时 API 拒绝启动
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      # Connector 默认拒绝私有地址（SSRF 防护）；这里显式允许 integrations 网络里的 Vikunja、n8n 容器
      INTEGRATION_ALLOWED_HOSTS: ${INTEGRATION_ALLOWED_HOSTS:-vikunja,n8n}
      # GitHub REST API 的地址；只有 CI 验收会改成模拟服务（Sprint 4 契约第 6.1 节）。
      # .env 里用 WORKSPACE_GITHUB_API_URL：GitHub Actions 会在 shell 里设置 GITHUB_API_URL，
      # 而 Compose 插值时 shell 变量优先于 .env
      GITHUB_API_URL: ${WORKSPACE_GITHUB_API_URL:-https://api.github.com}
      # API 只能经 Caddy 访问，取 X-Forwarded-For 最右侧的地址作为客户端 IP（登录限流用）
      TRUST_FORWARDED_FOR: "true"
      # 可选监控（--profile monitoring）：留空表示没有部署，运维页显示 not_configured
      PROMETHEUS_URL: ${PROMETHEUS_URL:-}
      GRAFANA_URL: ${GRAFANA_URL:-}
      GRAFANA_DASHBOARD_URL: ${GRAFANA_DASHBOARD_URL:-}
      # 访问日志里只记录路由模板（不含路径参数）时设为 route（S5-05）
      LOG_REQUEST_PATH: ${LOG_REQUEST_PATH:-path}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    # frontend 网络供 caddy 访问，也给 Connector 访问外网；integrations 连到独立部署的第三方服务（Vikunja 等）；
    # monitoring 供 Prometheus 抓取 /metrics、api 检查 Prometheus / Grafana 是否就绪
    networks: [backend, frontend, integrations, monitoring]
    logging: *logging

  worker:
    <<: [*api-image, *hardening]
    restart: unless-stopped
    command: ["arq", "app.jobs.worker.WorkerSettings", "--custom-log-dict", "app.jobs.worker.LOG_CONFIG"]
    environment:
      <<: *api-env
      # Worker 处理 Webhook 事件、周期对账、注册 Webhook：同样要解密凭证、遵守出站允许列表
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      INTEGRATION_ALLOWED_HOSTS: ${INTEGRATION_ALLOWED_HOSTS:-vikunja,n8n}
      # Vikunja 投递 Webhook 的目标：integrations 网络里的 caddy（不经过对外端口）
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-http://caddy:8080}
      # 周期对账的间隔（分钟，1–30）
      RECONCILE_INTERVAL_MINUTES: ${RECONCILE_INTERVAL_MINUTES:-5}
      GITHUB_API_URL: ${WORKSPACE_GITHUB_API_URL:-https://api.github.com}
      # 服务健康告警（每分钟检查 api、Prometheus、Grafana，变为不可用或恢复时通知管理员）
      API_INTERNAL_URL: http://api:8000
      PROMETHEUS_URL: ${PROMETHEUS_URL:-}
      GRAFANA_URL: ${GRAFANA_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "arq", "app.jobs.worker.WorkerSettings", "--check"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    # Worker 经 integrations 访问同机部署的第三方服务，经 egress 访问外部托管的服务（GitHub 周期同步）；
    # 出站地址仍由 Connector 的 SSRF 检查限制；monitoring 用于健康告警检查 Prometheus / Grafana
    networks: [backend, integrations, egress, monitoring]
    logging: *logging

  web:
    <<: *hardening
    build:
      context: apps/web
    image: my-workspace-web:local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [frontend]
    logging: *logging

  caddy:
    image: caddy:2.11.7-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    restart: unless-stopped
    ports:
      # 默认只绑定本机；在服务器上对外提供服务时，把 .env 里的 HTTP_BIND 改为 0.0.0.0 并配置 HTTPS
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # 官方镜像给 caddy 二进制设置了 cap_net_bind_service 文件能力，缺少它会无法启动
      - NET_BIND_SERVICE
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    # integrations：第三方服务经此把 Webhook 发到 /api/v1/webhooks/…（不经过对外端口）
    networks: [frontend, integrations]
    logging: *logging

  # ---------------------------------------------------------------- 可选监控（--profile monitoring）
  # 版本与安全边界见 docs/decisions/2026-10-31-prometheus-grafana-n8n-verification.md

  prometheus:
    <<: *hardening
    profiles: [monitoring]
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    restart: unless-stopped
    # 不加 --web.enable-admin-api / --web.enable-lifecycle / --web.enable-remote-write-receiver；
    # 详细数据保留 7 天（S5-05）
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    # 只在内部网络：/api/v1/status/config 等默认可读，所以不发布端口、不经 Caddy 转发
    networks: [monitoring]
    logging: *logging

  grafana:
    <<: *hardening
    profiles: [monitoring]
    image: grafana/grafana:13.2.5@sha256:9f7aa1e1e3246aade5792d35a738049f7f32f89cd51d1956cf426a4e86268a84
    restart: unless-stopped
    # 没有设置管理员密码时拒绝启动（否则 Grafana 会使用默认密码 admin）；make env 会随机生成
    entrypoint: ["/bin/sh", "-c", "test -n \"$$GF_SECURITY_ADMIN_PASSWORD\" || { echo '请先运行 make env 生成 GRAFANA_ADMIN_PASSWORD' >&2; exit 1; }; exec /run.sh"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_SERVER_ROOT_URL: ${GRAFANA_PUBLIC_URL:-http://localhost:3000}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ALLOW_EMBEDDING: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_LOG_MODE: console
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      # 默认只绑定本机；Grafana 有自己的登录，工作台只生成外链
      - "${GRAFANA_BIND:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    # monitoring 访问 Prometheus；monitoring-public 只用来发布端口给浏览器
    networks: [monitoring, monitoring-public]
    logging: *logging

networks:
  backend:
    internal: true
  frontend: {}
  # 与独立部署的第三方服务（infra/vikunja/compose.yaml 等）互通的受控网络：只有 api、worker、caddy 加入，
  # 第三方服务碰不到 backend 里的 PostgreSQL / Redis；internal 表示这个网络本身不提供出网
  integrations:
    internal: true
  # 只给 worker 出网用（api 经 frontend 出网）；不接任何别的服务
  egress: {}
  # 可选监控：api、worker、prometheus、grafana；internal，不提供出网
  monitoring:
    internal: true
  monitoring-public: {}

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:
