# OpenIM（工作台管理员端 IM 的后端）的独立 Compose —— OC-3 进行中，**还没接入工作台，不得用于生产**。
#
# 依据：docs/v2/TRANSFORMATION_PLAN.md 第 4.4、6.1 节；核验与越权问题见
# docs/decisions/2026-10-31-v2-oc0-openclaw-openim-verification.md。
#   - openim-server 用按 infra/openim/patches/ 自建的镜像（先运行 infra/openim/server/build.sh）；
#   - etcd、Kafka 用各自的官方镜像，并开启认证（etcd 用户与角色、Kafka SASL/PLAIN）；
#   - 对象存储用 Garage（S3 兼容；MinIO 官方镜像已不在 Docker Hub 发布，bitnamilegacy 不再更新），OpenIM 仍走 minio 驱动；
#   - OC-3 再接入 core 的网络、Caddy 接入入口与工作台回调地址，并把变量加进 .env.example / make env。
#
# 用法（只用于本机核验）：
#   docker compose -f infra/openim/compose.yaml --env-file infra/openim/.env up -d
# infra/openim/.env 需要（全部随机生成，例如 openssl rand -hex 16；禁止使用官方默认值 openIM123）：
#   OPENIM_SECRET  OPENIM_MONGO_ROOT_PASSWORD  OPENIM_MONGO_PASSWORD  OPENIM_REDIS_PASSWORD
#   OPENIM_GARAGE_RPC_SECRET（64 位十六进制）  OPENIM_GARAGE_ADMIN_TOKEN
#   OPENIM_S3_ACCESS_KEY（GK + 24 位十六进制）  OPENIM_S3_SECRET_KEY（64 位十六进制）
#   OPENIM_ETCD_ROOT_PASSWORD  OPENIM_ETCD_PASSWORD  OPENIM_KAFKA_PASSWORD（这三项只能是字母和数字）
#   OPENIM_WEBHOOK_URL（回调地址，只能是内部网络地址）

name: my-workspace-openim

networks:
  openim: {}

volumes:
  openim-mongo: {}
  openim-redis: {}
  # 换成官方镜像后数据目录与属主都变了，所以用新的数据卷名，不复用 bitnamilegacy 留下的卷
  openim-kafka-data: {}
  openim-etcd-data: {}
  openim-garage: {}

services:
  mongo:
    image: mongo:7.0.28@sha256:4510cf3d7050003e958745adb25d2deb3fb907430716162d9cc1a92eda2a6047
    command: ["mongod", "--wiredTigerCacheSizeGB", "1", "--auth"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${OPENIM_MONGO_ROOT_PASSWORD:?}
      MONGO_INITDB_DATABASE: openim_v3
      OPENIM_MONGO_PASSWORD: ${OPENIM_MONGO_PASSWORD:?}
    volumes:
      - openim-mongo:/data/db
      - ./mongo-init.sh:/docker-entrypoint-initdb.d/10-openim-user.sh:ro
    restart: unless-stopped
    networks: [openim]

  redis:
    image: redis:7.0.0@sha256:1b90dbfe6943c72a7469c134cad3f02eb810f016049a0e19ad78be07040cdb0c
    command: ["redis-server", "--requirepass", "${OPENIM_REDIS_PASSWORD:?}", "--appendonly", "yes"]
    volumes: [openim-redis:/data]
    restart: unless-stopped
    networks: [openim]

  etcd:
    # 官方镜像（distroless，没有 shell）；认证由 etcd-init 开启
    image: gcr.io/etcd-development/etcd:v3.5.34@sha256:04726053dabaf26b56ce7ef28c3d20b8b4a4006ed887d30194aa4f0756ee4f8d
    environment:
      ETCD_NAME: s1
      ETCD_DATA_DIR: /var/lib/etcd/data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd:2380
      ETCD_INITIAL_CLUSTER: s1=http://etcd:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_AUTO_COMPACTION_RETENTION: "1"
    volumes: [openim-etcd-data:/var/lib/etcd]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped
    networks: [openim]

  etcd-init:
    # 一次性：建 root / openim 用户并开启认证；以后每次启动同步 openim 的密码（etcd-init.sh）
    image: alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    command: ["sh", "/etcd-init.sh"]
    environment:
      OPENIM_ETCD_ROOT_PASSWORD: ${OPENIM_ETCD_ROOT_PASSWORD:?}
      OPENIM_ETCD_PASSWORD: ${OPENIM_ETCD_PASSWORD:?}
    volumes:
      - ./etcd-init.sh:/etcd-init.sh:ro
    user: "65534:65534"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on: [etcd]
    restart: "no"
    networks: [openim]

  kafka:
    # 官方镜像，KRaft 单节点。3.9 是最后一个保留旧协议版本的系列：OpenIM 的消费者按 Kafka 2.0 协议连接
    # （openimsdk/tools mq/kafka/config.go 的 sarama.V2_0_0_0），4.x 删掉了 2.1 以下的协议版本
    image: apache/kafka:3.9.2@sha256:05b4616e0702ef2729327705d54ad6b50ea70b271c4b730fabd2320789fb7b02
    environment:
      # KRaft 集群 ID（16 字节 UUID 的 base64url，不是密钥；只在第一次格式化数据目录时使用）
      CLUSTER_ID: -3bzyVp9S3yCan0auOL5yg
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:SASL_PLAINTEXT,CONTROLLER:SASL_PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # 所有连接都要 SASL/PLAIN；只有一个用户 openim（broker 之间与 OpenIM 共用）
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL: PLAIN
      KAFKA_LISTENER_NAME_INTERNAL_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="openim" password="${OPENIM_KAFKA_PASSWORD:?}" user_openim="${OPENIM_KAFKA_PASSWORD:?}";
      KAFKA_LISTENER_NAME_CONTROLLER_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="openim" password="${OPENIM_KAFKA_PASSWORD:?}" user_openim="${OPENIM_KAFKA_PASSWORD:?}";
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 8
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 8
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 消息由 OpenIM 写进 MongoDB 后，Kafka 里的只是中转：日志段 16 MiB、保留 3 天、索引上限 1 MiB
      # （默认 1 GiB 段与 10 MiB 索引会让空闲的 Kafka 占 1.7 GB，OC-0 ADR 第 8 节）
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_SEGMENT_BYTES: 16777216
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_LOG_INDEX_SIZE_MAX_BYTES: 1048576
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes: [openim-kafka-data:/var/lib/kafka/data]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped
    networks: [openim]

  garage:
    # S3 兼容的对象存储（AGPL-3.0）。镜像只有一个静态程序：没有 shell，初始化由 garage-init 完成
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    environment:
      GARAGE_RPC_SECRET: ${OPENIM_GARAGE_RPC_SECRET:?}
      GARAGE_ADMIN_TOKEN: ${OPENIM_GARAGE_ADMIN_TOKEN:?}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - openim-garage:/var/lib/garage
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped
    networks: [openim]

  garage-init:
    # 一次性：应用单节点布局、导入访问密钥、建桶并授权（garage-init.sh，幂等）
    image: alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    command: ["sh", "/garage-init.sh"]
    environment:
      OPENIM_GARAGE_ADMIN_TOKEN: ${OPENIM_GARAGE_ADMIN_TOKEN:?}
      OPENIM_S3_ACCESS_KEY: ${OPENIM_S3_ACCESS_KEY:?}
      OPENIM_S3_SECRET_KEY: ${OPENIM_S3_SECRET_KEY:?}
    volumes:
      - ./garage-init.sh:/garage-init.sh:ro
    user: "65534:65534"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on: [garage]
    restart: "no"
    networks: [openim]

  openim-server:
    # 打过补丁的自建镜像（OC-3）：infra/openim/server/build.sh 按锁定的上游提交与 patches/ 构建，
    # 不从镜像仓库拉取。官方镜像有越权问题（ADR 第 4 节），不要换回去
    image: my-workspace/openim-server:v3.8.3-patch.18-myws.2
    pull_policy: never
    init: true
    # 只绑定本机，用于核验；OC-3 改为只经 Caddy 接入入口访问
    ports:
      - "127.0.0.1:10001:10001"
      - "127.0.0.1:10002:10002"
    environment:
      IMENV_MONGODB_ADDRESS: mongo:27017
      IMENV_MONGODB_USERNAME: openim
      IMENV_MONGODB_PASSWORD: ${OPENIM_MONGO_PASSWORD:?}
      IMENV_KAFKA_ADDRESS: kafka:9094
      IMENV_KAFKA_USERNAME: openim
      IMENV_KAFKA_PASSWORD: ${OPENIM_KAFKA_PASSWORD:?}
      IMENV_DISCOVERY_ETCD_ADDRESS: etcd:2379
      IMENV_DISCOVERY_ETCD_USERNAME: openim
      IMENV_DISCOVERY_ETCD_PASSWORD: ${OPENIM_ETCD_PASSWORD:?}
      IMENV_REDIS_ADDRESS: redis:6379
      IMENV_REDIS_PASSWORD: ${OPENIM_REDIS_PASSWORD:?}
      # 对象存储：Garage 的 S3 接口，用 OpenIM 的 minio 驱动访问（只用标准 S3 接口，publicRead 保持 false）。
      # 外部地址出现在预签名链接里；接入工作台时改成接入入口的 /im/obj（OC-3 后续部分）
      IMENV_MINIO_INTERNALADDRESS: garage:3900
      IMENV_MINIO_EXTERNALADDRESS: ${OPENIM_OBJECT_EXTERNAL_URL:-http://127.0.0.1:3900}
      IMENV_MINIO_ACCESSKEYID: ${OPENIM_S3_ACCESS_KEY:?}
      IMENV_MINIO_SECRETACCESSKEY: ${OPENIM_S3_SECRET_KEY:?}
      IMENV_MINIO_BUCKET: openim
      IMENV_SHARE_SECRET: ${OPENIM_SECRET:?}
      IMENV_LOG_ISSTDOUT: "true"
      IMENV_LOG_REMAINLOGLEVEL: "3"
      # 回调没有签名：地址只能在内部网络（ADR 第 2 节第 10 项）
      IMENV_WEBHOOKS_URL: ${OPENIM_WEBHOOK_URL:?}
      IMENV_WEBHOOKS_AFTERUSERONLINE_ENABLE: "true"
      IMENV_WEBHOOKS_AFTERUSEROFFLINE_ENABLE: "true"
      IMENV_WEBHOOKS_AFTERSENDSINGLEMSG_ENABLE: "true"
      IMENV_WEBHOOKS_AFTERSENDGROUPMSG_ENABLE: "true"
      IMENV_WEBHOOKS_BEFORESENDSINGLEMSG_ENABLE: "true"
      IMENV_WEBHOOKS_BEFORESENDGROUPMSG_ENABLE: "true"
      IMENV_WEBHOOKS_AFTERDELETEFRIEND_ENABLE: "true"
      IMENV_WEBHOOKS_AFTERIMPORTFRIENDS_ENABLE: "true"
    depends_on:
      mongo: {condition: service_started}
      redis: {condition: service_started}
      kafka: {condition: service_started}
      garage-init: {condition: service_completed_successfully}
      etcd-init: {condition: service_completed_successfully}
    restart: unless-stopped
    networks: [openim]
