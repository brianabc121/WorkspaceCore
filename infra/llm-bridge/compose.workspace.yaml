# MCP 管理器（会话桥）和工作台在同一台服务器上时叠加这个文件（make llm-bridge-up 会自动加上）：
# 让它加入 core 的 integrations 网络，工作台用 http://<LLM_BRIDGE_ALIAS>:8787 访问它，不用把端口开到宿主机以外。
# 第一个管理器叫 llm-bridge，第 N 个叫 llm-bridge-<N>（make llm-bridge-up N=2）。
# integrations 是内部网络、不提供出网；管理器访问各平台走它自己的默认网络。
services:
  mcp-manager:
    networks:
      default: {}
      workspace-integrations:
        aliases:
          - ${LLM_BRIDGE_ALIAS:-llm-bridge}

networks:
  workspace-integrations:
    name: ${WORKSPACE_PROJECT:-my-workspace}_integrations
    external: true
